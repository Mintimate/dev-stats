.sync-to-github: &sync-to-github
  - name: 同步到 GitHub
    imports:
      - https://cnb.cool/Mintimate/secret/-/blob/main/SyncToGitHub.yml
    stages:
      - name: 自动同步代码
        image: tencentcom/git-sync
        settings:
          target_url: https://github.com/Mintimate/dev-stats.git
          auth_type: https
          username: ${GIT_USERNAME}
          password: ${GIT_ACCESS_TOKEN}
          force: true

$:
  push: *sync-to-github
  tag_push: *sync-to-github
  web_trigger_security_scan:
    - name: 安全扫描
      stages:
        - name: 开源组件漏洞全量扫描
          image: cnbcool/sca-vulnerability:latest
          timeout: 15m
          settings:
            scanMode: full
            publish: true
